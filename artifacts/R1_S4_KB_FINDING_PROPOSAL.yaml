  - "R1_S1_PREREGISTRATION_SEALED.md#C.2 support and exclusion rule"
  - "R1_S1_PREREGISTRATION_SEALED.md#I.3 power gate and half-width resolution"
  - "R1_S1_PREREGISTRATION_SEALED.md#M.1 sealed verdict guards"
  - "R1_S1_PREREGISTRATION_SEALED.md#R.2 prop-constraint treatment"
  - "artifacts/R1_S4_VERDICT.json#primary_guards"
sample_period: >
  NQ (MNQ, $2 per index point), CPI and NFP scheduled releases only, 2010-07-02 to 2021-12-10,
  Development sample. 252 structurally eligible events; 6 removed by the prespecified E4 rule
  (R_init exactly zero, so no direction is defined); n = 246 signal-defined events. FOMC was
  excluded by design and was never tested.
test_statistic: >
  Sealed stationary block bootstrap: expected block 5 events, 10,000 resamples per seed, seeds
  {7,13,31} pooled to 30,000 resample means, two-sided 95% percentile interval. Realized event-day
  sd = $49.48, SE = $3.15, CI half-width = $4.906555 against materiality M = $3.99. Guards:
  PRIMARY_INTERVAL_GATE FAIL (CI_lower -13.92 not > 3.99); EXCLUSION_PRECISION_GATE FAIL
  (upper -4.11 < M is TRUE, but half-width 4.91 < M is FALSE -- the binding failure);
  CONSERVATIVE_SURVIVAL FAIL (-10.27 not > 0); A1_GUARD PASS (sign holds, 126/246 members);
  C1_GUARD NOT RECOVERABLE (not persisted; verdict shown invariant to both of its values).
effect_size: >
  Base (primary sealed cost scenario, $3.99 round-turn): mean Y_net = -$8.768455 per event per 1 MNQ
  = -4.384 NQ index points. Conservative ($5.49 RT): -$10.268455. Stress ($6.24 RT): -$11.018455.
  Severe ($6.74 RT): -$11.518455. Median -$4.74; win rate 98/246 = 39.84%; min -$400.49, max +$252.51;
  cumulative -$2,157.04 over the 246 events. At ~21.5 events/year this is about -$188.53 per year per
  1 MNQ against a materiality bar of about +$85.79 per year.
confidence_interval: >
  95% pooled stationary-block bootstrap on mean Base Y_net = [-$13.920945, -$4.107835]. Entirely
  below the materiality threshold M = $3.99 AND entirely below zero. Half-width $4.906555 > M, which
  is why the sealed design cannot convert this into exclusion. The interval was independently
  recomputed at S4 from the 246 sealed outcome records and reproduces the stored interval exactly.
multiple_testing_status: >
  Lineage R1, SAMPLE_FORMAL_TRIAL_ORDINAL = 2, one and only one Primary run (RUN_ID R1-S3B-001,
  runs_executed = 1). Inherited researcher exposure count 1575 from prior lineage ITSF S0-T001.
  No subgroup search, no parameter sweep, no seed selection: a single prespecified rule, tested once.
limitations:
  - >
    UNDERPOWERED FOR FALSIFICATION, not for direction. The OD-3 pre-run power gate sized the study on
    the dispersion of NON-EVENT control days (s_hat = $28.21), which understated realized event-day
    dispersion ($49.48, about 1.75x) and projected a half-width of ~$3.53 when the realized value was
    $4.91. The gate therefore cleared on a precision the Primary never achieved. The OD-3 decision was
    made before any outcome existed and altered no sealed design element.
  - >
    E4 removed 6 of 252 events (R_init exactly zero). This is prespecified and outcome-blind, but it
    means n = 246 rather than 252.
  - >
    The 2025-Q1 spread proxy applied to earlier pre-open history remains a disclosed cost-model
    limitation (sealed residual P-5). It was deliberately not resolved by a data purchase before the seal.
  - >
    Axis-2 mechanism specificity is NOT ESTABLISHED, but the D statistic and its interval were not
    persisted in the sealed bundle. The engine returns NOT_ESTABLISHED both when D is absent and when
    its 95% lower bound is <= 0, so the verdict is determinate while it cannot be independently reconstructed
    without a rerun, which is forbidden.
  - >
    C1_clears_m, the vol-tercile / era / micro-era / event-type disclosures and the A1 per-event
    membership list were not persisted in the sealed bundle and cannot be reported from it.
  - >
    A bundle FIELD-LABEL defect exists: payload["mean_y_net_usd"] carries the Conservative arm point
    estimate, not the Base mean (r1/pipeline.py:176). No stored value is wrong and the verdict is
    unaffected, but a naive reader of that field would misreport the Primary by $1.50 per event.
  - >
    Scope is bounded to CPI + NFP, NQ, the 08:33 to 09:29 window, this Development sample and this
    sealed rule. Nothing here extrapolates to FOMC, other instruments, other horizons or other
    entry/exit choices.
contradicted_by: []
notes: >
  FAILURE TYPE: INSUFFICIENT_EVIDENCE_LOW_POWER. The binding constraint is the sealed precision
  requirement for exclusion, not the direction of the estimate. Read the two facts together and keep
  them apart: (1) on this sample the rule LOST money under every sealed cost scenario, with the whole
  95% interval below zero -- that is real negative evidence and it should not be softened; (2) the
  sealed contract still refuses to call an effect of size >= M excluded, because the half-width bar
  was not met -- so this is NOT a falsification and must not be catalogued as one.
  PROP FEASIBILITY, reported per sealed R.2 as a feasibility fact and not a strategy result: maximum
  adverse excursion per event per 1 MNQ has median -$13.25, p90 -$81.25, p99 -$199.45 and worst
  -$485.75 (2021-03-05); at ONE micro, 0 of 246 events breach either the $1,000 DLL or the $2,000
  trailing MLL of a 50k prop account, while 7.72% of events exceed $100 of adverse excursion.
  Excursion feasibility is therefore not the blocker -- the negative Primary is.
  RE-RESEARCH ELIGIBILITY: CONDITIONAL. Forbidden: any re-test of this rule on this sample, any
  window/parameter/cost/k/exit tweak, any CPI-versus-NFP split promoted as a winner, and any renaming
  of the same failed rule as a new study. Permitted only under a NEW lineage with a new seal and a
  new sample: a genuinely distinct mechanism or a genuinely untested subspace, powered on EVENT-DAY
  dispersion rather than control-day dispersion. FOMC remains separately DEFERRED and was never
  tested by R1 -- it is untested, not falsified.
  METHOD LESSON worth a research-lesson card in its own right: when a power gate's nuisance parameter
  is estimated on control days but the Primary runs on event days, the gate can license a run that
  cannot reach its own falsification bar.
  FORMAL CLAIM STATUS vs OBSERVED ESTIMATE -- these are two different facts and this card keeps them
  apart. FORMAL CLAIM STATUS = unresolved / insufficient evidence: that is what the sealed rule
  licenses, because the exclusion criterion needs CI half-width < M and 4.906555 > 3.99. OBSERVED
  ESTIMATE = strongly negative: the Base mean is -$8.768455 per event per 1 MNQ, the whole 95%
  interval [-13.920945, -4.107835] is below zero, and all four sealed cost scenarios are negative.
  Neither fact may be used to erase the other. Do not reduce this card to a generic not_promoted, and
  do not relabel it contradicted or falsified.
