id: finding.nq-event-diffusion.r1-cpi-nfp-continuation-unresolved
claim: >
  A preregistered, sealed, once-only test of scheduled-release information-diffusion continuation in
  NQ -- enter at O(08:33) in the direction of the 08:29-to-08:31 initial reaction, exit at O(09:29),
  k=1, CPI and NFP only -- is UNRESOLVED at the sealed materiality of $3.99 per event per MNQ: the
  Base point estimate is NEGATIVE at -$8.77 per event and the entire 95% interval lies below zero,
  but the sealed exclusion rule additionally requires a CI half-width below M and the realized
  half-width ($4.91) exceeds it, so an effect of size >= M is not excluded with the prespecified
  precision and the rule is not falsified either.
claim_status: unresolved
evidence_type: preregistered_primary
strategy_ids: []
factor_ids: []
source_repository: "nq-event-diffusion-research"
