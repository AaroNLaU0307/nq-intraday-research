#           approval 哈希改用 canonical 算法消除自引用；A1 报价改为估算、执行时强制重报价。
# 状态：草案，等待（1）Freeze Commit A/B，（2）Aaron 填批准字段（Commit C）

plan_id: PP-2026-07-27-A
revision: 3
status: draft_pending_freeze_and_approval

approval:                          # Aaron 批准时填写（Purchase Approval Commit C）
  approved_by: null
  approved_date: null
  approved_charter_sha256: null            # Freeze Commit A 中文件哈希
  approved_preregistration_sha256: null    # Freeze Commit A 中文件哈希
  approved_plan_body_sha256: null          # 按下方算法对本文件（除 approval 节点）计算
  plan_hash_algorithm: "sha256-canonical-json-excluding-approval-v1"
  #   算法：读取 YAML → 删除整个 approval 节点 → 其余内容转键排序 canonical JSON
  #   → UTF-8 编码 → SHA-256。填写批准字段不改变被批准的采购主体哈希。
  max_out_of_pocket_usd: 0.00
  approval_note: null

