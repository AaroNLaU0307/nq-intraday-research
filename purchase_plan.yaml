  1. PROJECT_CHARTER.md v1.2-r2 + STUDY_0_PREREGISTRATION.md v0.2 → Freeze Commit A（tag: s0-freeze-v1）
  2. FREEZE_LOG.md 登记 Commit A 哈希 → Registry Commit B
