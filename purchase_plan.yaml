  estimated_total_usd: 20.93               # A1 估算 14.30 + A2 已报价 6.63
  hard_cost_cap_usd: 23.00                 # 重报价合计超过 → 中止
  requote_tolerance: 1.10                  # 单项重报价超估算/原报价 110% → 中止
  credit_check_required: true

