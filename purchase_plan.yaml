  - MNQ/MES/MGC ohlcv-1m
  - ES / GC / MES / MGC 任何 schema
  - trades / tbbo 任何窗口

post_purchase_pipeline:
  - batch 提交后立即下载全部文件与官方 support files
  - SHA-256 逐文件校验
  - 归档至 C:\Users\Aaron\quant-data\databento-archive\intraday-trend\<job_id>\
  - 按 data_role 建立独立目录与读取边界
  - 本地 manifest（data_file_count / support_file_count 分列）
  - 记录换月 symbology 映射
  - 提醒撤销临时 API key
  - 第二物理副本（不同介质）在首次研究计算前完成
  - S0 冻结 commit 之前，研究代码不得读取任何新购数据

sequencing_precondition: |
  1. PROJECT_CHARTER.md + STUDY_0_PREREGISTRATION.md → Freeze Commit A（tag: s0-freeze-v1）
  2. FREEZE_LOG.md 登记 → Registry Commit B
  3. Aaron 填写 approval（含 canonical 哈希）→ Purchase Approval Commit C
  4. 新建临时 Databento key 注入环境变量
  5. 重报价 → 核对 cap/credit/哈希 → 采购 → 下载 → 校验 → 归档 → 撤销 key
