# ITSF-S0 state file (L6 Runtime spec §2). LIVE as of 2026-08-24.
#
# `lane` was declared by Aaron; `workflow_stage` by this working session.
# Which is which, and on what authority, is recorded at each field.
#
# Every other value here is TRANSCRIBED from a canonical ITSF artifact, with
# the source named. Nothing is inferred. Per the ratified §10.2 the DECLARED
# partition is a non-authoritative self-report — canonical artifacts win in
# their domains, always — and per §2.1 the state file is edited only by
# working sessions of this project, which is what wrote this draft.
#
# The CLI's YAML subset takes double-quoted scalars only and no trailing
# comments, so every note here sits on its own line.

schema_version: "17"

# ---------------------------------------------------------------- DECLARED --
# research_id: free value, declares no vocabulary (§2.4).
# S0-T001 is the TRIAL id, not the research id.
research_id: "ITSF-S0"

# lane: FULL | MEASUREMENT | EXPLORATORY, closed, "Never inferred" (§2.4).
#
# DECLARED BY AARON, 2026-08-24, by adopting the working session's
# recommendation. His words, verbatim: 「直接按你建议的做吧，能执行的全执行」,
# answering a message whose recommendation was FULL with its basis. Lane
# declarations sit in §4.1's Authority row, so this records HIS act, not the
# session's — the session recommended and he adopted. Precedent for the
# shape: IR-29, where Aaron sent a named prompt and then said 「那现在执行吧」.
#
# Basis of the recommendation he adopted: QROS §1 makes lane semantics
# "which claims the work may emit, nothing else". The sealed prereg §10.4
# commits to emitting STOP / GO / β / α — a strategy-performance verdict on
# deployment. MEASUREMENT may not emit that; EXPLORATORY may emit no
# confirmatory performance evidence at all. FULL is the only lane whose
# may-emit set contains what this project's own sealed contract promises to
# produce.
#
# Consequence, recorded rather than hidden: FULL makes A2 an unconditional
# gate that can never be retroactively satisfied — no runs/ A2 record exists
# and B is long past (SEAL=VERIFIED). The state file will permanently show
# A2 → B HOLD. That is an honest permanent disclosure of a real gap, and it
# is why ITSF can supply a Stage I pilot for §9.1 but never an A2 one.
lane: "FULL"

# workflow_stage: A A2 B C D E F G H I J K L, closed (§2.5). The stage
# currently DUE OR IN PROGRESS — not a status, not a verdict, not a health
# indicator.
#
# DECLARED BY THE WORKING SESSION. I asked Aaron for this one and should not
# have: §4.1's Authority row is "every K-stage decision, seals, unlocks, LANE
# DECLARATIONS, seat-map changes, all spends". `workflow_stage` is not in it,
# and §10.2 makes DECLARED a working-session self-report that no canonical
# artifact is overridden by. So it is mine to state and Aaron's to correct.
#
# C. Basis: S0 itself ran and was revealed, but its verdict is
# INCONCLUSIVE_PENDING_MC — the Checkpoint-0 statistic is produced by the MC,
# and the MC pipeline is under construction (N01–N13). N16 is the
# preregistered run, which is E. So what is in progress is the build.
# Contestable, and recorded as contestable: read the MC as a separate study
# and ITSF-S0 sits at F awaiting its evidence.
workflow_stage: "C"

# §10.4 requires a one-line `MATERIALITY: ORDINARY | MATERIAL` in the
# measurement plan or preregistration. SEARCHED: no such line exists in this
# repository. The one MATERIALITY string present is
# `MATERIALITY_CONCLUSION=NOT_ESTABLISHED`, in a post-reveal addendum — a
# different statement about a different question. Per §10.4 absence renders
# UNKNOWN, and UNKNOWN holds `F -> L`. Fail-closed and correct; not a gap to
# paper over by declaring ORDINARY.
measurement_materiality: "UNKNOWN"

# §3.4. S0-T001 was revealed 2026-08-14; the ledger records the whole of it.
#
# scope: HISTORICAL_CUMULATIVE, not CURRENT_REVIEW_SCOPE. §3.4A makes scope
# the POPULATION a value is computed over, and every row in the ledger is a
# historical event; there is no current review to scope to. My first draft
# said CURRENT_REVIEW_SCOPE and the runtime returned UNKNOWN because no row
# fell in that population -- fail-closed, and correct.
# D-1 条件 1（Fable 裁定 2026-08-26，DELEGATED=YES）：双向可发现性必须机械化。
# 本项目的暴露分两条轴，各有台账，**两者并举**：
#   研究轴  ops/EXPOSURE_LEDGER.md        —— 研究自由度消耗；`scope` 一栏说的是它
#   席位轴  ops/REVIEWER_EXPOSURE_LOG.md  —— 复审席位被烧；不消耗研究自由度
# 下面的 `scope` 是运行时的封闭枚举，装不下路径（试过加兄弟字段，validator 判
# OUTCOME_EXPOSURE_SHAPE 拒绝），所以指针在这里，强制在
# tests/test_exposure_discoverability.py。
outcome_exposure:
  declared: "TARGET_METRIC"
  scope: "HISTORICAL_CUMULATIVE"

