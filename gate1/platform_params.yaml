# =============================================================================
lucidflex_50k:
  evaluation:
    evidence: [lucid_flex_evaluation]
    fee_model: one_time_no_rebilling
    fees:                                # G1 关闭（evidence: lucid_50k_flex_eval_png，2026-07-28 截图）
      purchase_fee_usd: 98.00            # 标价 $140，"w/ coupon at checkout"
      list_price_usd: 140.00
      reset_fee_usd: 95.00
      sales_tax_or_checkout_fee: NOT_VERIFIED   # 截图未含 checkout 税费行（子缺口，非阻断：MC 加 0/8% 敏感性）
      discount_policy: "coupon 于 checkout 生效；持续性未验证——Primary 用 $98 现价，Sensitivity 用 $140 标价"
    reference_products:                  # 同日截图归档（非 Primary，供未来 entry_mode 研究）
      lucid_50k_pro_eval:  {price_usd: 129.50, reset_usd: 110.40, dll_usd: 1200, evidence: lucid_50k_pro_eval_png}
      lucid_50k_direct_instant_funded: {price_usd: 364.00, consistency_pct: 20, dll_below_trail_usd: 1200, evidence: lucid_50k_direct_png}
    time_limit: none
    profit_target_usd: 3000
    consistency:
      nominal_pct: 50
      formula: "largest_single_day_profit / account_profit <= 0.50"
      cushion:
        exists: true
        example_50k: {nominal_usd: 1500, cushion_usd: 1560}   # evidence: lucid_consistency
        formula: UNKNOWN   # 缺口 G6：官方明示为随实际盈利浮动的百分比，非固定金额
        decision_role: "Primary 按严格 50%；cushion 仅作敏感性，不进 Primary 判决"
    dll: none
    scaling_in_evaluation: none          # 评估期无 scaling，第一天即满仓（lucid_scaling）
    max_position: {minis: 4, micros: 40}
    upgrade: {activation_fee_usd: 0, delay: "5-30 分钟"}
  mll_engine:                            # 机器公式（GPT 建议格式；数值经快照验证）
    evidence: [lucid_flex_drawdown, lucid_breach_reply_png]
    starting_balance_usd: 50000
    initial_mll_usd: 48000
    trail_distance_usd: 2000
    initial_trail_balance_usd: 52100
    locked_mll_usd: 50100
    eod_update: "mll_next = min(50100, max(mll_current, eod_closing_balance - 2000))"
    payout_effect: "mll_next = 50100"
    intraday_breach: "realtime_equity_including_unrealized <= current_mll → 即时违规"
    breach_scope: "评估与 funded 相同"
    breach_evidence_grade: "Level 2-AI：Lucid support 两轮回复均为 AI bot 生成（Aaron
      2026-07-28 披露），非人工确认。V-A 维持 Primary：(a) 与官方页 'If your account
      balance reached the MLL, your account will be breached' 一致；(b) V-A 为保守方向，
      若 bot 有误则偏差只低估生存率导向 STOP，不产生虚假 GO。可选跟进：人工客服复确认。"
  funded:
    evidence: [lucid_flex_funded, lucid_scaling]
    dll: none
    consistency: none
    payout_buffer: none
    profit_split_trader_pct: 90
    absolute_max_position: {minis: 4, micros: 40}
    scaling_tiers:                       # 按模拟盈利，双向浮动，session 结束后更新
      update_time: end_of_session
      bidirectional: true                # payout 扣减余额可导致降档
      tiers_50k:                         # 机器区间（官方表格式 "$0-$999" 的标准读法）
        - {lower_inclusive: 0,    upper_exclusive: 1000, minis: 2, micros: 20}
        - {lower_inclusive: 1000, upper_exclusive: 2000, minis: 3, micros: 30}
        - {lower_inclusive: 2000,                        minis: 4, micros: 40}
      negative_simulated_profit_tier: UNRESOLVED   # 官方表自 $0 起；负盈利档位待 support
                                                   # 书面确认（lucid_inquiry_2.md 问题 1）；
                                                   # 确认前 MC 保守取最低档 2/20 并标注假设
      circumvention: "反复规避限额可致当日利润清零/账户审查"
  payouts:
    evidence: [lucid_flex_payouts]
    qualifying_days_required: 5
    qualifying_day_min_profit_usd: 150   # 每次批准 payout 后重置重计
    cycle_net_profit: {comparator: ">", threshold_usd: 0, evidence_example_usd: 1}
    min_request_usd: 500
    max_request: "50% of profit, cap $2,000（50K）；上限不随次数增长"
    max_payouts_before_live_review: 5
    fixed_payout_window: none
    processing: "批准后数分钟扣账；2 个工作日到账"
    trading_during_processing_risk: "处理前交易致余额低于要求 → 申请可能被拒"
  commissions_per_side_usd:
    evidence: [lucid_products_comms]
    NQ: 1.75
    MNQ: 0.50
    ES: 1.75
    MES: 0.50
    GC: 2.30
    MGC: 0.80
    note: "AI bot 确认帮助页未写明全含性（lucid_reply2）→ 保守 Primary 见 execution_costs"

# 统一执行成本表（v0.4；机器参数——S0 逐笔 P&L 已扣费，MC 严禁重复扣除）
execution_costs:
  topstepx_mnq:
    total_round_turn_usd: 1.22           # evidence: topstepx_commissions（全含：commission+exchange+NFA）
  lucidflex_mnq:
    quoted_commission_per_side_usd: 0.50
    conservative_primary:
      exchange_clearing_fee_per_side_usd: 0.35   # PROVISIONAL —— G9：首次 S0 计算前须以
      nfa_fee_per_side_usd: 0.02                 # CME/NFA 官方费表快照确认后转正
      total_round_turn_usd: 1.74
    sensitivity_all_in:
      total_round_turn_usd: 1.00
