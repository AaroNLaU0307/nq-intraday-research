# =============================================================================
topstep_50k:
  trading_day:
    evidence: [topstep_combine_params]
    session: "5:00 PM CT → 次日 3:10 PM CT；此后强平至 5:00 PM CT"
  combine:
    evidence: [topstep_combine_params, topstep_pricing, topstep_consistency, topstep_mll]
    subscription_usd_per_month: {standard_path: 49, no_activation_path: 95}
    reset_fee_usd: {standard_path: 49, no_activation_path: 95}
    profit_target_usd: 3000
    mll_engine:
      starting_balance_usd: 50000
      initial_mll_usd: 48000
      trail_distance_usd: 2000
      locked_mll_usd: 50000              # MLL 达到起始余额时锁定（≈日终余额达 $52,000）
      eod_update: "mll_next = min(50000, max(mll_current, eod_balance - 2000))"
      intraday_breach: "realtime_net_pnl_including_unrealized 触及 → 当日强平；Reset 后恢复资格"
    consistency_target:
      type: soft_target_increase
      rule: "best_day > 0.5 × profit_target → 新目标 = best_day ÷ 0.50"
      best_day_lock_time: "15:10 America/Chicago"
    max_position: {minis: 5, micros: 50, ratio: "10:1"}
  dll:                                   # 完整状态机；同时适用 Combine 与 XFA（checkout 版固定）
    evidence: [topstep_dll_optional, topstep_payout, topstep_mll]
    optional: true
    threshold_usd_50k: 1000
    reference_equity: session_start_equity          # v0.4：基准唯一化
    reference_reset_time: "17:00 America/Chicago"
    net_pnl_formula: "dll_net_pnl = realtime_equity - session_start_equity"
    trigger_condition: "dll_net_pnl <= -1000"
    breach_path: adverse_path            # 实时 Net P&L 含未实现（topstep_mll："Same logic applies"）
    on_trigger:
      flatten_positions: true
      cancel_orders: true
      block_new_orders_until: "next session 17:00 America/Chicago"
      close_account: false
      temporary_violation: true
      payout_request_blocked_until_violation_lifts: true
    set_at_checkout_fixed: true
    carries_to_xfa: true
    distinct_from_pdll: "手动 PDLL 可随时调整/移除，属个人风控层，不进平台状态机"
  subscription_engine:                   # v0.4 新增（evidence: topstep_subscriptions，2026-06-18）
    charged_at_purchase: true
    rebill_interval_days: 30             # 自原始注册日起，非自然月
    rebill_credit_granted: 1             # 每次 rebill 送 1 个 Reset Credit（存于 profile，
                                         # 可用于未来同规格 Combine；取消订阅后该账户不可再 reset）
    auto_cancel_on_pass: true
    continues_after_mll_breach: true     # 爆仓后订阅继续扣费、账户练习模式直至 reset
    no_pause: true
    pass_deadline_vs_rebill: "rebill 日前一交易日收盘前 dashboard 显示通过才免扣"
  reset_policy:
    use_available_reset_credit_first: true
    paid_reset_fee_usd: {standard_path: 49, no_activation_path: 95}
    reset_effect_on_rebill_date: NOT_FOUND_IN_SNAPSHOT   # 子缺口 G8："What is the Reset?" 页待抓
    primary_policy: "失败即刻 reset（有 credit 用 credit，无则付费）——24 月期界内时间成本高于费差"
    sensitivity_policy: "等待下一次 rebill 的免费 credit"
    stats_reset_on_reset: true
  activation:
    evidence: [topstep_pricing]
    standard_path_activation_usd: 149
    no_activation_path_usd: 0
  xfa:
    evidence: [topstep_xfa_params, topstep_mll, topstep_payout, topstep_consistency]
    balance_start_usd: 0                 # "50K" 为购买力标签
    max_active_xfa: 5
    payout_path_chosen_at_activation: true   # Standard / Consistency 二选一
    mll_engine:
      starting_balance_usd: 0
      initial_mll_usd: -2000
      locked_mll_usd: 0
      eod_update: "mll_next = min(0, max(mll_current, eod_balance - 2000))"
      payout_effect: "mll_next = 0（永久）"
      intraday_breach: "realtime_net_pnl_including_unrealized 触及 → 永久关户"
    scaling_tiers:                       # evidence: topstep_xfa_scaling_table_png
      basis: current_account_balance
      update: next_session_only          # 盘中不上调
      tiers_50k:                         # 图表原文 Below/–/Above 的机器编码
        - {upper_exclusive: 1500,                        lots: 2, micros: 20}
        - {lower_inclusive: 1500, upper_inclusive: 2000, lots: 3, micros: 30}
        - {lower_exclusive: 2000,                        lots: 5, micros: 50}
      payout_effect: "payout 降低余额至低档 → 上限相应下调"
    payout_paths:
      standard:
        qualifying: "5 个盈利日，每日净利 ≥ $150（不需连续）"
        payout_day_lock_time: "16:00 America/Chicago"   # 与 Combine 的 15:10 属不同阶段参数
        cycle_net_profit: ">= $0.01（首次豁免）"
        max_request: "余额 50%，cap $2,000"
        after_payout: "MLL 永久 = $0；5 日计数重启；申请当日不计入下轮"
      consistency:
        qualifying: "≥3 交易日（每日≥1笔）＋ largest_winning_day/total_net_profit ≤ 0.40（不取整）"
        max_request: "余额 50%，cap $3,000"
        after_payout: "MLL = $0；consistency 与 3 日计数重启（新窗口自次一交易日）"
    payout_cap_promotion:                # 限时促销，非稳定制度
      rule: "购买 Combine 时加 DLL → cap 翻倍（$4,000 / $6,000）"
      status: limited_time_offering
      offer_expiry: unknown
      decision_role: "Primary: dll=false, promotion=false；Sensitivity: dll=true, cap×2"
    payout_min_usd: 125
    profit_split:
      default_trader_pct: 90
      grandfathered_cohort:
        condition: "joined_new_dashboard_before_2026-01-12"
        first_lifetime_profit_usd: 10000
        trader_pct_on_first_lifetime_profit: 100
      decision_role: "Primary = 现在新开账户 = 90/10；不得事后选用旧 cohort"
    payout_processing: "XFA 资金即时扣账、可立即交易"
    payout_rail:                         # v0.4：Primary 通道冻结（马来西亚 = 国际用户）
      primary: {method: Wise, topstep_fee_usd: 0, processing: "1-3 工作日", note: "Wise 自身汇兑费不计入平台费"}
      alternatives: {ACH_usd: 30, Wire_usd: 30, Aeropay_usd: 0, Prop_to_brokerage: US_only}
    lucid_payout_rail: {method_fee_usd: NOT_FOUND, assumption: "Primary 按 $0 建模并披露；到账 2 工作日"}
    back2funded:
      evidence: [topstep_back2funded, topstep_pricing, topstep_mll]
      max_reactivations_per_xfa: 2
      availability_after_first_payout: false
      window_days: 30
      requires: [topstepx_new_dashboard, good_standing]
      focused_trader_plan_eligible: false
      retains: [account_size, payout_path, dll_selection]
      fee_50k_usd: 599
      dll_discount_usd: 50
      effect: "余额 $0、统计清零、MLL 回 -$2,000（同全新 XFA）；次一 session 可交易"
      not_counted_toward_5_limit_until_paid: true
  lfa:
    evidence: [topstep_payout, topstep_live_funded, topstep_api]
    payout: "每周期 5 个 ≥$150 盈利日；50% 余额无上限；30 盈利日后解锁每日提款"
    dll: automatic
    automation: "允许自动化，但禁止经 ProjectX API 自动交易"
    payout_processing_conduct: "申请后应暂停交易至处理完成"
  api:
    evidence: [topstep_api]
    list_price_usd_per_month: 29
    recurring_code_price_usd_per_month: 14.50   # code "topstep"，官方称长期有效
    discount_dependency: "promo code"
    decision_role: "Primary（保守）$29；current-policy 敏感性 $14.50"
    vps_vpn_remote: prohibited
    allowed_phases: {combine: true, xfa: true, lfa_projectx_api: false}
  data_fees:
    evidence: [topstep_pricing]
    level1: included
    level2_usd_per_month: 38

